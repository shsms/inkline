[package]
name = "inkline"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Syntax highlighting, history suggestions and bracket pairing for bash's readline"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
# src/syntax.rs works around how these exact versions recover from errors;
# its tests hold it to tests/data/syntax-cases.txt, and tests/syntax_corpus.rs
# holds that file to bash. Update the two crates together and rerun the tests.
tree-sitter = "=0.27.0"
tree-sitter-bash = "=0.25.1"
unicode-width = "0.2"

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3"
vt100 = "0.16"
